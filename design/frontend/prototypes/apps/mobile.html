<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Apps · Cynexus Mobile</title>
<style>
@font-face{font-family:"Manrope Mobile";src:url("../../../../cynexus-ui/public/fonts/manrope/manrope-latin-variable.woff") format("woff");font-weight:400 800;font-style:normal;font-display:swap}
:root{color-scheme:light;--ink:#202a34;--muted:#687582;--line:#e5eaed;--sky:#c4dff0;--mint:#d4e9e7;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:max(20px,env(safe-area-inset-bottom,0px));--clearance:calc(64px + var(--safe-bottom) + 24px);font-family:"Manrope Mobile",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:grid;place-items:center;background:#eef1f3;color:var(--ink)}
button,input,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;touch-action:manipulation}
button,input{border:0}
a{text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3,p{margin:0}
svg{display:block;width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{position:relative;width:min(100%,440px);height:100dvh;overflow:hidden;background:#fff}
.header{position:absolute;z-index:20;inset:0 0 auto;padding-top:var(--safe-top);pointer-events:none}
.header::before{position:absolute;content:"";inset:0;opacity:0;background:#ffffff70;transition:opacity 180ms ease}
.app.is-scrolled .header::before{opacity:1}
.header-inner{position:relative;display:grid;min-height:80px;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;padding:0 20px;pointer-events:auto}
.header-control{display:grid;width:44px;height:44px;place-items:center;padding:0;border:1px solid #d7e0e8;border-radius:50%;background:#fff}
.workspace-trigger{border:3px solid #fff;background:#a8cbe7}
.workspace-trigger[aria-expanded="true"]{box-shadow:0 0 0 3px #c7dceb}
.search-trigger svg{width:24px;height:24px;stroke-width:1.6}
.greeting{min-width:0;text-align:center}
.greeting strong{display:block;font-size:16px;font-weight:750;line-height:23px}
.greeting p{color:var(--muted);font-size:14px;line-height:21px}
.scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:none;scroll-padding-block:96px var(--clearance)}
.scroll::-webkit-scrollbar{display:none}
main{min-width:0;padding:calc(87px + var(--safe-top)) 20px var(--clearance)}
.page-heading{display:flex;min-height:52px;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}
.page-heading h1{font-size:24px;font-weight:700;line-height:30px;letter-spacing:-.6px}
.page-heading p{margin-top:3px;color:var(--muted);font-size:12px;line-height:18px}
.total{color:var(--muted);font-size:12px;white-space:nowrap}
.section{margin-top:24px}
.section:first-child{margin-top:0}
.section-heading{display:flex;min-width:0;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.section-heading h2{font-size:16px;font-weight:650;line-height:22px;letter-spacing:-.25px}
.section-heading>span{color:var(--muted);font-size:10px;line-height:16px;white-space:nowrap}
.shared-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shared-card{display:flex;min-width:0;min-height:116px;flex-direction:column;justify-content:space-between;gap:13px;padding:16px;border-radius:24px;background:var(--sky);color:#243d4d}
.shared-card.knowledge{background:var(--mint);color:#284843}
.shared-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shared-card-top>svg{width:24px;height:24px;stroke-width:1.5}
.open-circle{display:grid;width:26px;height:26px;place-items:center;border-radius:50%;background:#ffffff70}
.open-circle svg{width:15px;height:15px}
.shared-card strong{font-size:16px;font-weight:650;line-height:21px;letter-spacing:-.35px}
.personal-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;border-block:1px solid var(--line)}
.personal-app{position:relative;display:flex;min-width:0;min-height:62px;align-items:center;gap:10px}
.personal-app+.personal-app::before{position:absolute;content:"";top:17px;bottom:17px;left:-10px;width:1px;background:var(--line)}
.personal-app>svg{width:23px;height:23px;stroke-width:1.5}
.personal-app strong{min-width:0;font-size:14px;font-weight:600}
.personal-app .chevron{width:15px;height:15px;margin-left:auto;color:var(--muted)}
.group{margin-top:23px}
.group-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:1px}
.group-heading h2{font-size:14px;font-weight:700;line-height:22px}
.group-heading span{color:var(--muted);font-size:10px}
.app-row{display:grid;min-width:0;min-height:54px;grid-template-columns:23px minmax(0,1fr) 17px;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.app-row>svg:first-child{width:22px;height:22px;stroke-width:1.5}
.app-row strong{min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:550;line-height:20px}
.app-row .chevron{width:16px;height:16px;color:var(--muted)}
.nav{position:absolute;z-index:20;inset:auto 0 0;padding:8px 20px var(--safe-bottom);pointer-events:none}
.nav-layout{display:flex;min-width:0;align-items:center;gap:10px}
.nav-capsule,.add-button{border:1px solid #ffffffd9;background:#fffffff0;box-shadow:0 8px 22px #354b5a10,inset 0 1px 0 #fff;pointer-events:auto}
.nav-capsule{display:grid;min-width:0;height:64px;flex:1;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:4px;border-radius:999px}
.nav-item{display:flex;min-width:0;min-height:54px;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:4px 0;border-radius:999px;color:#757575}
.nav-item span{font-size:10px;font-weight:600;line-height:13px}
.nav-item svg{width:20px;height:20px;stroke-width:1.8}
.nav-item[aria-current="page"]{background:var(--ink);color:#fff}
.add-button{display:grid;width:64px;height:64px;flex:0 0 64px;place-items:center;padding:0;border-radius:50%}
.add-button>span{display:grid;width:46px;height:46px;place-items:center;border-radius:50%;color:white;background:#25323e}
.add-button svg{width:23px;height:23px;stroke-width:2.2}
.workspace-menu{position:absolute;z-index:30;top:calc(76px + var(--safe-top));left:20px;width:min(264px,calc(100% - 40px));padding:16px 10px 10px;border:1px solid #edf1f3;border-radius:28px;background:#fff;box-shadow:0 12px 38px #202a3420}
.workspace-menu>p{padding:0 12px 10px;color:var(--muted);font-size:11px}
.workspace-option{display:flex;width:100%;min-height:60px;align-items:center;gap:12px;padding:8px 12px;border-radius:20px;background:#fff;text-align:left;font-size:14px;font-weight:600}
.workspace-option>svg{width:22px;height:22px}
.workspace-option[aria-checked="true"]{background:#e7f0f7}
.workspace-option .check{width:20px;height:20px;margin-left:auto}
.workspace-option[aria-checked="false"] .check{visibility:hidden}
.search-dialog{width:min(400px,calc(100% - 32px));max-height:calc(100dvh - 48px);margin:auto;padding:22px 20px;border:0;border-radius:28px;background:#fff;color:var(--ink)}
.search-dialog::backdrop{background:#202a3455}
.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dialog-heading h2{font-size:20px;line-height:26px}
.close-search{width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:50%;background:#f2f4f5}
.search-field{display:flex;height:48px;align-items:center;gap:10px;padding:0 14px;border:1px solid #d7e0e8;border-radius:24px}
.search-field input{min-width:0;width:100%;background:transparent;outline:0;font-size:16px}
.search-field input::placeholder{color:var(--muted)}
.search-help{margin-top:10px;color:var(--muted);font-size:12px;line-height:18px}
.search-results{max-height:50dvh;margin-top:14px;overflow-y:auto;scrollbar-width:none}
.search-results small{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:400}
.empty{padding:30px 10px;text-align:center}
.empty strong{display:block;font-size:16px}
.empty p{margin-top:6px;color:var(--muted);font-size:12px;line-height:19px}
.empty button{min-height:44px;margin-top:10px;padding:0 14px;border-radius:22px;background:#f1f3f5;font-size:12px;font-weight:650}
.toast{position:absolute;z-index:40;right:20px;bottom:var(--clearance);left:20px;padding:13px 16px;border-radius:18px;background:var(--ink);color:#fff;text-align:center;font-size:12px;line-height:18px;box-shadow:0 6px 20px #202a3420}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.header::before{background:#ffffff47;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.nav-capsule,.add-button{background:#ffffffb8;-webkit-backdrop-filter:blur(12px) saturate(1.08);backdrop-filter:blur(12px) saturate(1.08)}}
@media(min-width:600px){.app{height:min(920px,calc(100dvh - 48px));border-radius:32px;box-shadow:0 12px 50px #202a3410}}
@media(max-width:359px){.header-inner{padding-inline:16px}main{padding-inline:16px}.nav{padding-inline:16px}.nav-layout{gap:8px}.nav-item span{font-size:9px}.nav-item svg{width:18px;height:18px}.shared-card{padding:14px;border-radius:22px}.shared-card strong{font-size:14px;line-height:20px;letter-spacing:-.3px}.workspace-menu{left:16px}.greeting strong{font-size:14px}.greeting p{font-size:12px}}
@media(hover:hover){.shared-card:hover{filter:brightness(.975)}.app-row:hover,.personal-app:hover{background:#f7f9fa}.nav-item:not([aria-current]):hover{color:var(--ink)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>

<script>
const sharedApps = [
  {name:'Cynexus Agent',icon:'sparkles',path:'/cynexus-agent',group:'Shared apps',style:'agent'},
  {name:'Knowledge Base',icon:'book-open-text',path:'/m/knowledge-base',group:'Shared apps',style:'knowledge'},
];
const personalApps = [
  {name:'Workout',icon:'dumbbell',path:'/m/workout',group:'Personal apps'},
  {name:'Food',icon:'apple',path:'/m/food',group:'Personal apps'},
];
const workspaceGroups = {
  personal:[
    {name:'Daily life',items:[{name:'Finance',icon:'wallet-cards',path:'/m/finance'}]},
    {name:'Content tools',items:[{name:'Parsing Tool',icon:'file-text',path:'/mp4-to-word'}]},
    {name:'Investment research',items:[
      {name:'Trade View',icon:'chart-no-axes-combined',path:'/trade-review'},
      {name:'Cynexus Screener',icon:'list-filter',path:'/cynexus-screener'},
      {name:'Market',icon:'activity',path:'/market/overview'},
      {name:'Stock Overview',icon:'chart-no-axes-combined',path:'/stock-overview'},
      {name:'Stock Review',icon:'chart-line',path:'/stock-review'},
      {name:'Information',icon:'newspaper',path:'/information'},
    ]},
    {name:'Intraday monitoring',items:[{name:'Data Collector',icon:'database',path:'/data-collector/market-indicator'}]},
  ],
  development:[
    {name:'Overview',items:[{name:'Dashboard',icon:'layout-dashboard',path:'/dashboard'}]},
    {name:'AI management',items:[{name:'AI',icon:'brain-circuit',path:'/ai'}]},
    {name:'Operations',items:[{name:'Settings',icon:'settings',path:'/settings/scheduler'}]},
    {name:'Experiments',items:[{name:'POC',icon:'flask-conical',path:'/poc'}]},
  ],
};
const icons=(name,cls='')=>'<svg class="'+cls+'" aria-hidden="true"><use href="#icon-'+name+'"/></svg>';
const itemCount=items=>items.length+' '+(items.length===1?'app':'apps');
const workspaceName=()=>workspace==='personal'?'Personal':'Development';
const allApps=()=>[...sharedApps,...personalApps,...workspaceGroups[workspace].flatMap(group=>group.items.map(item=>({...item,group:group.name})))];
const row=(item,searchResult=false)=>'<a class="app-row" href="http://localhost:5174'+item.path+'" data-preview="'+item.name+'">'+icons(item.icon)+'<strong>'+item.name+(searchResult?'<small>'+item.group+'</small>':'')+'</strong>'+icons('chevron-right','chevron')+'</a>';
const workspaceMenu=document.querySelector('#workspace-menu');
const workspaceTrigger=document.querySelector('#workspace-trigger');
const searchDialog=document.querySelector('#search-dialog');
const searchInput=document.querySelector('#search-input');
const scroll=document.querySelector('#page-scroll');
let workspace='personal';
let toastTimer;
function renderDirectory(){
  document.querySelector('#workspace-label').textContent=workspaceName()+' workspace';
  document.querySelector('#app-count').textContent=itemCount(allApps());
  workspaceTrigger.setAttribute('aria-label','Switch workspace: '+workspaceName());
  document.querySelectorAll('[data-workspace]').forEach(option=>option.setAttribute('aria-checked',String(option.dataset.workspace===workspace)));
  document.querySelector('#directory').innerHTML=
    '<section class="section" aria-labelledby="shared-title"><div class="section-heading"><h2 id="shared-title">Shared apps</h2><span>Both workspaces</span></div><div class="shared-grid">'+sharedApps.map(item=>
      '<a class="shared-card '+item.style+'" href="http://localhost:5174'+item.path+'" data-preview="'+item.name+'"><span class="shared-card-top">'+icons(item.icon)+'<span class="open-circle">'+icons('arrow-up-right')+'</span></span><strong>'+(item.name==='Knowledge Base'?'Knowledge<br>Base':'Cynexus<br>Agent')+'</strong></a>').join('')+
    '</div></section><section class="section" aria-labelledby="personal-title"><div class="section-heading"><h2 id="personal-title">Personal apps</h2><span>'+itemCount(personalApps)+'</span></div><div class="personal-strip">'+personalApps.map(item=>
      '<a class="personal-app" href="http://localhost:5174'+item.path+'" data-preview="'+item.name+'">'+icons(item.icon)+'<strong>'+item.name+'</strong>'+icons('chevron-right','chevron')+'</a>').join('')+
    '</div></section>'+workspaceGroups[workspace].map((group,index)=>
      '<section class="group" aria-labelledby="group-'+index+'"><div class="group-heading"><h2 id="group-'+index+'">'+group.name+'</h2><span>'+itemCount(group.items)+'</span></div>'+group.items.map(item=>row(item)).join('')+'</section>').join('');
}
document.querySelector('#nav-items').innerHTML=[
  {name:'Home',icon:'house',path:'/m'},
  {name:'Apps',icon:'layout-grid',path:'/m/apps'},
  {name:'Finance',icon:'wallet-cards',path:'/m/finance'},
  ...personalApps,
  {name:'Profile',icon:'user-round',path:'/m/me'},
].map(item=>'<a class="nav-item" href="http://localhost:5174'+item.path+'" '+(item.name==='Apps'?'aria-current="page"':'data-preview="'+item.name+'"')+'>'+icons(item.icon)+'<span>'+item.name+'</span></a>').join('');
function setWorkspaceOpen(open,focus=false){
  workspaceMenu.hidden=!open;
  workspaceTrigger.setAttribute('aria-expanded',String(open));
  if(focus&&open)workspaceMenu.querySelector('[aria-checked="true"]').focus();
}
workspaceTrigger.addEventListener('click',()=>setWorkspaceOpen(workspaceMenu.hidden));
workspaceTrigger.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();setWorkspaceOpen(true,true)}});
workspaceMenu.addEventListener('click',event=>{
  const option=event.target.closest('[data-workspace]');
  if(!option)return;
  workspace=option.dataset.workspace;
  renderDirectory();
  scroll.scrollTop=0;
  setWorkspaceOpen(false);
  workspaceTrigger.focus({preventScroll:true});
});
workspaceMenu.addEventListener('keydown',event=>{
  const options=[...workspaceMenu.querySelectorAll('[data-workspace]')];
  if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){
    event.preventDefault();
    let index=options.indexOf(document.activeElement);
    index=event.key==='Home'?0:event.key==='End'?options.length-1:(index+(event.key==='ArrowDown'?1:-1)+options.length)%options.length;
    options[index].focus();
  }
});
document.addEventListener('click',event=>{if(!workspaceMenu.contains(event.target)&&!workspaceTrigger.contains(event.target))setWorkspaceOpen(false)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!workspaceMenu.hidden){setWorkspaceOpen(false);workspaceTrigger.focus({preventScroll:true})}});
scroll.addEventListener('scroll',()=>document.querySelector('#app').classList.toggle('is-scrolled',scroll.scrollTop>8),{passive:true});
function renderSearch(){
  const query=searchInput.value.trim().toLowerCase();
  const matches=allApps().filter(item=>(item.name+' '+item.group).toLowerCase().includes(query));
  document.querySelector('#search-help').textContent='In '+workspaceName()+' and shared apps';
  document.querySelector('#search-results').innerHTML=matches.length?matches.map(item=>row(item,true)).join(''):'<div class="empty"><strong>No apps found</strong><p>Try another name or clear your search.</p><button type="button" id="clear-search">Clear search</button></div>';
}
document.querySelector('#search-trigger').addEventListener('click',()=>{
  setWorkspaceOpen(false);searchInput.value='';renderSearch();searchDialog.showModal();
  // Keep the keyboard closed until the user intentionally taps the input.
  document.querySelector('#close-search').focus({preventScroll:true});
});
searchInput.addEventListener('input',renderSearch);
document.querySelector('#search-results').addEventListener('click',event=>{if(event.target.id==='clear-search'){searchInput.value='';renderSearch();searchInput.focus()}});
document.querySelector('#close-search').addEventListener('click',()=>searchDialog.close());
searchDialog.addEventListener('click',event=>{if(event.target===searchDialog){const r=searchDialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)searchDialog.close()}});
searchDialog.addEventListener('close',()=>document.querySelector('#search-trigger').focus({preventScroll:true}));
function notify(message){
  const toast=document.querySelector('#toast');
  clearTimeout(toastTimer);toast.textContent=message;toast.hidden=false;
  toastTimer=setTimeout(()=>toast.hidden=true,2500);
}
document.addEventListener('click',event=>{
  const link=event.target.closest('[data-preview]');
  if(link){event.preventDefault();if(searchDialog.open)searchDialog.close();notify(link.dataset.preview+' · Design preview')}
  if(event.target.closest('.nav-item[aria-current]')){event.preventDefault();scroll.scrollTo({top:0})}
});
document.querySelector('#add-button').addEventListener('click',()=>notify('Quick actions · Shared mobile control'));
document.querySelector('#date-label').textContent='Today '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'.';
renderDirectory();
</script>
</body>
</html>
