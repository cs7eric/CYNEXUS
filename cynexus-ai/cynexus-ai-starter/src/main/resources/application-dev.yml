server:
  port: 28081

spring:
  application:
    name: cynexus-ai-dev
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    openfeign:
      client:
        config:
          cynexus-market:
            url: http://127.0.0.1:28082
  datasource:
    url: jdbc:postgresql://127.0.0.1:25433/cynexus?currentSchema=cynexus_appl_ai
    username: postgres
    password: C020611.
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: C020611.

cynexus:
  ai:
    market-information:
      deepseek-live-limit: ${CYNEXUS_AI_DEEPSEEK_LIVE_LIMIT:20}
    langfuse:
      enabled: ${CYNEXUS_AI_LANGFUSE_ENABLED:false}
      base-url: ${CYNEXUS_AI_LANGFUSE_BASE_URL:http://127.0.0.1:33000}
      public-key: ${CYNEXUS_AI_LANGFUSE_PUBLIC_KEY:}
      secret-key: ${CYNEXUS_AI_LANGFUSE_SECRET_KEY:}
    security:
      provider-allowed-origins: ${CYNEXUS_AI_PROVIDER_ALLOWED_ORIGINS:http://127.0.0.1:28081,https://api.openai.com,https://api.deepseek.com,https://am.xtyooo.top,https://dashscope.aliyuncs.com}
      langfuse-allowed-origins: ${CYNEXUS_AI_LANGFUSE_ALLOWED_ORIGINS:http://127.0.0.1:33000}
