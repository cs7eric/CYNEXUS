server:
  port: 18081

spring:
  autoconfigure:
    exclude:
      - org.jobrunr.spring.autoconfigure.JobRunrAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrInMemoryStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrMongoDBStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrDocumentDBStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrSqlStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.metrics.JobRunrMetricsAutoConfiguration
  application:
    name: cynexus-ai
  config:
    import:
      - optional:nacos:cynexus-ai.yml
      - optional:nacos:cynexus-common.yml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:10848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: true
        register-enabled: true
        service: ${spring.application.name}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
        ephemeral: true
        metadata:
          management.port: ${server.port}
      config:
        enabled: true
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:25433}/${POSTGRES_DB_AI:${POSTGRES_DB:cynexus}}?currentSchema=${POSTGRES_SCHEMA:cynexus_appl_ai}"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:C020611.}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:C020611.}

cynexus:
  ai:
    platform:
      enabled: ${CYNEXUS_AI_PLATFORM_ENABLED:false}
      default-provider: ${CYNEXUS_AI_DEFAULT_PROVIDER:mock}
      providers:
        openai:
          base-url: ${CYNEXUS_AI_OPENAI_BASE_URL:https://api.openai.com}
          api-key-env: CYNEXUS_AI_OPENAI_API_KEY
        deepseek:
          base-url: ${CYNEXUS_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
          api-key-env: CYNEXUS_AI_DEEPSEEK_API_KEY
        custom:
          base-url: ${CYNEXUS_AI_CUSTOM_BASE_URL:https://am.xtyooo.top}
          api-key-env: CYNEXUS_AI_CUSTOM_API_KEY
        dashscope:
          base-url: ${CYNEXUS_AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
          api-key-env: CYNEXUS_AI_DASHSCOPE_API_KEY
          chat-model: ${CYNEXUS_AI_DASHSCOPE_CHAT_MODEL:qwen-plus}
          embedding-model: ${CYNEXUS_AI_DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
      rag:
        vector-store: ${CYNEXUS_AI_RAG_VECTOR_STORE:pgvector}
        embedding-dimensions: ${CYNEXUS_AI_RAG_EMBEDDING_DIMENSIONS:1024}
      speech:
        asr-model: ${CYNEXUS_AI_ASR_MODEL:paraformer-realtime-v2}
        tts-model: ${CYNEXUS_AI_TTS_MODEL:cosyvoice-v1}
    market-information:
      deepseek-live-limit: ${CYNEXUS_AI_DEEPSEEK_LIVE_LIMIT:0}
    langfuse:
      enabled: ${CYNEXUS_AI_LANGFUSE_ENABLED:false}
      base-url: ${CYNEXUS_AI_LANGFUSE_BASE_URL:http://127.0.0.1:33000}
      public-key: ${CYNEXUS_AI_LANGFUSE_PUBLIC_KEY:}
      secret-key: ${CYNEXUS_AI_LANGFUSE_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

jobrunr:
  job-scheduler:
    enabled: false
  background-job-server:
    enabled: false
  dashboard:
    enabled: false
