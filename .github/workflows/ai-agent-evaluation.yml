name: AI Agent Evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cynexus-ai/**"
      - "cynexus-ui/src/services/ai/**"
      - "cynexus-ui/src/views/ai/**"
      - "docs/ai-agent-architecture.md"
      - "docs/ai-agent-evaluation.json"
      - "ci/run-ai-agent-evaluation.ps1"
      - "pom.xml"
  push:
    branches: [master]
    paths:
      - "cynexus-ai/**"
      - "cynexus-ui/src/services/ai/**"
      - "cynexus-ui/src/views/ai/**"
      - "docs/ai-agent-architecture.md"
      - "docs/ai-agent-evaluation.json"
      - "ci/run-ai-agent-evaluation.ps1"
      - "pom.xml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Agent evaluation and contract tests
        shell: pwsh
        run: ./ci/run-ai-agent-evaluation.ps1

      - name: Publish evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-evaluation-report
          if-no-files-found: error
          path: cynexus-ai/cynexus-ai-application/cynexus-ai-application-controller/target/agent-evaluation-results.json
