server:
  port: 18080

spring:
  application:
    name: cynexus-core
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  config:
    import:
      - optional:nacos:cynexus-core.yml
      - optional:nacos:cynexus-common.yml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:10848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: true
        register-enabled: true
        service: ${spring.application.name}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
        ephemeral: true
        metadata:
          management.port: ${server.port}
      config:
        enabled: true
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:25433}/${POSTGRES_DB_CORE:${POSTGRES_DB:cynexus}}?currentSchema=${POSTGRES_SCHEMA:cynexus_appl_core}"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:C020611.}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:C020611.}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

cynexus:
  data:
    job-executor:
      base-url: ${CYNEXUS_DATA_JOB_EXECUTOR_BASE_URL:http://127.0.0.1:18083}
      internal-token: ${CYNEXUS_DATA_INTERNAL_TOKEN:}
      timeout-ms: ${CYNEXUS_DATA_JOB_EXECUTOR_TIMEOUT_MS:600000}
  media-transcription:
    downloader:
      base-url: ${CYNEXUS_MEDIA_TRANSCRIPTION_DOWNLOADER_BASE_URL:https://downloader-api.bhwa233.com}
      timeout-ms: ${CYNEXUS_MEDIA_TRANSCRIPTION_DOWNLOADER_TIMEOUT_MS:60000}
    worker:
      base-url: ${CYNEXUS_MEDIA_TRANSCRIPTION_WORKER_BASE_URL:http://127.0.0.1:18083/internal/media-transcription}
      internal-token: ${CYNEXUS_MEDIA_TRANSCRIPTION_WORKER_INTERNAL_TOKEN:${CYNEXUS_DATA_INTERNAL_TOKEN:}}
      timeout-ms: ${CYNEXUS_MEDIA_TRANSCRIPTION_WORKER_TIMEOUT_MS:600000}
    process:
      initial-delay-ms: ${CYNEXUS_MEDIA_TRANSCRIPTION_PROCESS_INITIAL_DELAY_MS:5000}
      dispatch-delay-ms: ${CYNEXUS_MEDIA_TRANSCRIPTION_PROCESS_DISPATCH_DELAY_MS:2000}
      executor-core-size: ${CYNEXUS_MEDIA_TRANSCRIPTION_PROCESS_EXECUTOR_CORE_SIZE:2}
      executor-max-size: ${CYNEXUS_MEDIA_TRANSCRIPTION_PROCESS_EXECUTOR_MAX_SIZE:4}
      executor-queue-capacity: ${CYNEXUS_MEDIA_TRANSCRIPTION_PROCESS_EXECUTOR_QUEUE_CAPACITY:20}
  market:
    automation:
      base-url: ${CYNEXUS_MARKET_AUTOMATION_BASE_URL:http://127.0.0.1:18082}
      timeout-ms: ${CYNEXUS_MARKET_AUTOMATION_TIMEOUT_MS:30000}
  finance:
    ai:
      base-url: ${CYNEXUS_FINANCE_AI_BASE_URL:http://127.0.0.1:28081}
