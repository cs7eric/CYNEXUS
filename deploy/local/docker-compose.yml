name: cynexus-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: cynexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      POSTGRES_DB: cynexus
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:25433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: cynexus-nacos
    restart: unless-stopped

    environment:
      MODE: standalone

      # 本地开发先关闭鉴权，方便微服务直接连
      NACOS_AUTH_ENABLE: "false"

      # Nacos 2.2.1+ 之后这些安全参数不能完全依赖默认值，建议显式写上
      NACOS_AUTH_TOKEN: "VGhpcyBpcyBhIGN5bmV4dXMgbG9jYWwgZGV2IG5hY29zIHRva2VuIDIwMjY="
      NACOS_AUTH_IDENTITY_KEY: "cynexus-nacos-key"
      NACOS_AUTH_IDENTITY_VALUE: "cynexus-nacos-value"

      # 降低本机开发时的内存占用
      JVM_XMS: "256m"
      JVM_XMX: "512m"
      JVM_XMN: "128m"

    ports:
      # 宿主机改用 10848/11910/11911，避开当前 Windows 预留的端口区间
      - "10848:8848"

      # 本机直连 Nacos 2.x 客户端时，gRPC 端口会按主端口偏移到 11910
      - "11910:9848"

      # 服务端 gRPC 端口一并平移，便于本地排查
      - "11911:9849"

    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
  redis:
    image: redis:7.2-alpine
    container_name: cynexus-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "C020611."
      ]
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "C020611.", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: cynexus-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cynexus
      RABBITMQ_DEFAULT_PASS: C020611.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: cynexus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: cynexus
      CLICKHOUSE_USER: cynexus
      CLICKHOUSE_PASSWORD: C020611.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:28123:8123"
      - "127.0.0.1:29000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./clickhouse/config.d/merge_tree_recovery.xml:/etc/clickhouse-server/config.d/merge_tree_recovery.xml:ro
      - ./clickhouse/config.d/observability_retention.xml:/etc/clickhouse-server/config.d/observability_retention.xml:ro
      - ./clickhouse/users.d/observability_profile.xml:/etc/clickhouse-server/users.d/observability_profile.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--host",
          "127.0.0.1",
          "--user",
          "cynexus",
          "--password",
          "C020611.",
          "--query",
          "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  data-job-executor:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.data
    image: cynexus-data-job-executor:cpu
    container_name: cynexus-data-job-executor
    restart: unless-stopped
    command: ["cynexus-trigger-api", "--host", "0.0.0.0", "--port", "18083"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CYNEXUS_DATA_PROJECT_ROOT: /app
      CYNEXUS_PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
      CYNEXUS_DATA_INTERNAL_TOKEN: ${CYNEXUS_DATA_INTERNAL_TOKEN:-}
      CYNEXUS_SOCIAL_BACKEND: ${CYNEXUS_SOCIAL_BACKEND:-cdp}
      CYNEXUS_SOCIAL_CDP_HOST: ${CYNEXUS_SOCIAL_CDP_HOST:-host.docker.internal}
      CYNEXUS_SOCIAL_CDP_PORT_XIAOHONGSHU: ${CYNEXUS_SOCIAL_CDP_PORT_XIAOHONGSHU:-19221}
      CYNEXUS_SOCIAL_CDP_PORT_DOUYIN: ${CYNEXUS_SOCIAL_CDP_PORT_DOUYIN:-19222}
      EASTMONEY_QGQP_B_ID: ${EASTMONEY_QGQP_B_ID:-}
      EASTMONEY_NID18: ${EASTMONEY_NID18:-}
      EASTMONEY_CHROMIUM_EXECUTABLE: ${EASTMONEY_CHROMIUM_EXECUTABLE:-/usr/bin/chromium}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-C020611.}@postgres:5432/cynexus
      MARKET_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-C020611.}@postgres:5432/cynexus
      CORE_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-C020611.}@postgres:5432/cynexus
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-C020611.}
      REDIS_DB: 0
      REDIS_TIMEOUT: 2
      POSTGRES_SCHEMA: cynexus_appl_market
      POSTGRES_MARKET_SCHEMA: cynexus_appl_market
      POSTGRES_CORE_SCHEMA: cynexus_appl_core
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DATABASE: cynexus
      CLICKHOUSE_USER: cynexus
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-C020611.}
      DUCKDB_PATH: /app/var/market_data.duckdb
      TDX_ROOT: /app/var/tdx/day/hsjday
      CYNEXUS_MEDIA_TRANSCRIPTION_WORK_ROOT: /app/var/media-transcription
      CYNEXUS_MEDIA_TRANSCRIPTION_TRANSCRIBER: ${CYNEXUS_MEDIA_TRANSCRIPTION_TRANSCRIBER:-cynexus_data.pipelines.transcription.providers.faster_whisper:FasterWhisperTranscriber}
      CYNEXUS_MEDIA_TRANSCRIPTION_TRANSCRIBER_PARAMS: ${CYNEXUS_MEDIA_TRANSCRIPTION_TRANSCRIBER_PARAMS:-{"device":"cpu","compute_type":"int8","beam_size":1,"vad_filter":true,"fallback_device":"cpu"}}
      # Optional URL-native provider. Leave empty to keep the existing local Faster Whisper flow.
      CYNEXUS_MEDIA_TRANSCRIPTION_REMOTE_TRANSCRIBER: ${CYNEXUS_MEDIA_TRANSCRIPTION_REMOTE_TRANSCRIBER:-}
      CYNEXUS_MEDIA_TRANSCRIPTION_REMOTE_TRANSCRIBER_PARAMS: ${CYNEXUS_MEDIA_TRANSCRIPTION_REMOTE_TRANSCRIBER_PARAMS:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_ENDPOINT: ${DASHSCOPE_ENDPOINT:-https://dashscope.aliyuncs.com/api/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-paraformer-v2}
      CYNEXUS_MEDIA_TRANSCRIPTION_LANGUAGE: ${CYNEXUS_MEDIA_TRANSCRIPTION_LANGUAGE:-zh}
      CYNEXUS_MEDIA_TRANSCRIPTION_MODEL_PATH: ${CYNEXUS_MEDIA_TRANSCRIPTION_MODEL_PATH:-/app/var/models/whisper-large-v3-ct2}
    ports:
      - "127.0.0.1:18083:18083"
    volumes:
      - ../../cynexus-data/var:/app/var
      - type: bind
        source: ${CYNEXUS_TDX_LOCAL_ROOT:-D:/Program File/tdx}
        target: /app/tdx
        read_only: true
      - type: bind
        source: ${CYNEXUS_PARQUET_1M_ROOT:-F:/data/stock_1min}
        target: /app/parquet/stock_1min
        read_only: true
      - ${CYNEXUS_MEDIA_TRANSCRIPTION_MODEL_HOST_PATH:-F:/dev-repo/mp4-to-word-new/models/AI-ModelScope}:/models/transcription:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:18083/internal/health', timeout=3)); raise SystemExit(0 if data.get('ok') else 1)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
