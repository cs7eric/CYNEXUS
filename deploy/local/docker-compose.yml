name: cynexus-dev

services:
  postgres:
    image: postgres:18
    container_name: cynexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      POSTGRES_DB: cynexus
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:25433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: cynexus-nacos
    restart: unless-stopped

    environment:
      MODE: standalone

      # 本地开发先关闭鉴权，方便微服务直接连
      NACOS_AUTH_ENABLE: "false"

      # Nacos 2.2.1+ 之后这些安全参数不能完全依赖默认值，建议显式写上
      NACOS_AUTH_TOKEN: "VGhpcyBpcyBhIGN5bmV4dXMgbG9jYWwgZGV2IG5hY29zIHRva2VuIDIwMjY="
      NACOS_AUTH_IDENTITY_KEY: "cynexus-nacos-key"
      NACOS_AUTH_IDENTITY_VALUE: "cynexus-nacos-value"

      # 降低本机开发时的内存占用
      JVM_XMS: "256m"
      JVM_XMX: "512m"
      JVM_XMN: "128m"

    ports:
      # Nacos 控制台 / HTTP API / 客户端主端口
      - "8848:8848"

      # Nacos 2.x 客户端 gRPC 端口，Spring Cloud Alibaba 连接时需要
      - "9848:9848"

      # Nacos 2.x 服务端 gRPC 端口；本地单机一般不用，但显式暴露便于排查
      - "9849:9849"

    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
  redis:
    image: redis:7.2-alpine
    container_name: cynexus-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "C020611."
      ]
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "C020611.", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: cynexus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: cynexus
      CLICKHOUSE_USER: cynexus
      CLICKHOUSE_PASSWORD: C020611.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:28123:8123"
      - "127.0.0.1:29000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--host",
          "127.0.0.1",
          "--user",
          "cynexus",
          "--password",
          "C020611.",
          "--query",
          "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  core:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-core/cynexus-core-starter
        JAR_NAME: cynexus-core-starter-1.0.0-SNAPSHOT.jar
    image: cynexus-core:local
    container_name: cynexus-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      NACOS_SERVER_ADDR: nacos:8848
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: C020611.
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  market:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-market/cynexus-market-starter
        JAR_NAME: cynexus-market-starter-1.0.0-SNAPSHOT.jar
    image: cynexus-market:local
    container_name: cynexus-market
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      core:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      NACOS_SERVER_ADDR: nacos:8848
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: C020611.
    ports:
      - "127.0.0.1:18082:18082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ai:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-ai/cynexus-ai-starter
        JAR_NAME: cynexus-ai-starter-1.0.0-SNAPSHOT.jar
    image: cynexus-ai:local
    container_name: cynexus-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      core:
        condition: service_healthy
      market:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      NACOS_SERVER_ADDR: nacos:8848
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: C020611.
    ports:
      - "127.0.0.1:18081:18081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  gateway:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-gateway/cynexus-gateway-starter
        JAR_NAME: cynexus-gateway-starter-1.0.0-SNAPSHOT.jar
    image: cynexus-gateway:local
    container_name: cynexus-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
      core:
        condition: service_healthy
      market:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      NACOS_SERVER_ADDR: nacos:8848
    ports:
      - "127.0.0.1:18000:18000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  clickhouse-data:
  clickhouse-logs:
