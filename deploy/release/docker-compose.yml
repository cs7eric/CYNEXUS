name: cynexus-release

services:
  core:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-core/cynexus-core-starter
        JAR_NAME: cynexus-core-starter-${CYNEXUS_MAVEN_VERSION:-1.1.1-ALPHA-260716-SNAPSHOT}.jar
    image: cynexus-core:${CYNEXUS_RELEASE_VERSION:-1.1.1-ALPHA-260716-RELEASE}
    container_name: cynexus-release-core
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: cynexus-nacos:8848
      POSTGRES_HOST: cynexus-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      REDIS_HOST: cynexus-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: C020611.
      CYNEXUS_DATA_JOB_EXECUTOR_BASE_URL: http://cynexus-data-job-executor:18083
      CYNEXUS_MEDIA_TRANSCRIPTION_WORKER_BASE_URL: http://cynexus-data-job-executor:18083/internal/media-transcription
      CYNEXUS_MEDIA_TRANSCRIPTION_AI_BASE_URL: http://ai:18081/api/ai/media-transcription
      CYNEXUS_MARKET_AUTOMATION_BASE_URL: http://market:18082
      CYNEXUS_FINANCE_AI_BASE_URL: http://ai:18081
    ports:
      - "127.0.0.1:18080:18080"
    networks: [cynexus-shared]

  knowledgebase:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-knowledgebase/cynexus-knowledgebase-starter
        JAR_NAME: cynexus-knowledgebase-starter-${CYNEXUS_MAVEN_VERSION:-1.1.1-ALPHA-260716-SNAPSHOT}.jar
    image: cynexus-knowledgebase:${CYNEXUS_RELEASE_VERSION:-1.1.1-ALPHA-260716-RELEASE}
    container_name: cynexus-release-knowledgebase
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: cynexus-nacos:8848
      POSTGRES_HOST: cynexus-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
    ports:
      - "127.0.0.1:18084:18084"
    networks: [cynexus-shared]

  wechat:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-wechat/cynexus-wechat-starter
        JAR_NAME: cynexus-wechat-starter-${CYNEXUS_MAVEN_VERSION:-1.1.1-ALPHA-260716-SNAPSHOT}.jar
    image: cynexus-wechat:${CYNEXUS_RELEASE_VERSION:-1.1.1-ALPHA-260716-RELEASE}
    container_name: cynexus-release-wechat
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: cynexus-nacos:8848
      POSTGRES_HOST: cynexus-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_wechat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      REDIS_HOST: cynexus-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: C020611.
      CYNEXUS_WECHAT_TOKEN: ${CYNEXUS_WECHAT_TOKEN:-}
      CYNEXUS_WECHAT_APP_ID: ${CYNEXUS_WECHAT_APP_ID:-}
      CYNEXUS_WECHAT_APP_SECRET: ${CYNEXUS_WECHAT_APP_SECRET:-}
      CYNEXUS_WECHAT_API_BASE_URL: ${CYNEXUS_WECHAT_API_BASE_URL:-https://api.weixin.qq.com}
      CYNEXUS_WECHAT_IMAGE_STORAGE_DIR: ${CYNEXUS_WECHAT_IMAGE_STORAGE_DIR:-/data/cynexus/wechat/images}
      CYNEXUS_WECHAT_IMAGE_MAX_BYTES: ${CYNEXUS_WECHAT_IMAGE_MAX_BYTES:-10485760}
      HTTP_PROXY: ${CYNEXUS_HTTP_PROXY:-}
      HTTPS_PROXY: ${CYNEXUS_HTTPS_PROXY:-}
      ALL_PROXY: ${CYNEXUS_HTTPS_PROXY:-}
      NO_PROXY: ${CYNEXUS_NO_PROXY:-localhost,127.0.0.1,cynexus-postgres,cynexus-redis,cynexus-nacos,cynexus-ai}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18085:18085"
    volumes:
      - ./wechat-images:/data/cynexus/wechat/images
    networks: [cynexus-shared]

  market:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-market/cynexus-market-starter
        JAR_NAME: cynexus-market-starter-${CYNEXUS_MAVEN_VERSION:-1.1.1-ALPHA-260716-SNAPSHOT}.jar
    image: cynexus-market:${CYNEXUS_RELEASE_VERSION:-1.1.1-ALPHA-260716-RELEASE}
    container_name: cynexus-release-market
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: cynexus-nacos:8848
      POSTGRES_HOST: cynexus-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      REDIS_HOST: cynexus-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: C020611.
      CLICKHOUSE_HTTP_URL: http://cynexus-clickhouse:8123
      CLICKHOUSE_DATABASE: cynexus
      CLICKHOUSE_USER: cynexus
      CLICKHOUSE_PASSWORD: C020611.
      RABBITMQ_HOST: cynexus-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: cynexus
      RABBITMQ_PASSWORD: C020611.
      CYNEXUS_AI_API_BASE_URL: http://ai:18081
      CYNEXUS_DATA_QUERY_API_BASE_URL: http://cynexus-data-job-executor:18083
      CYNEXUS_TRUSTED_IDENTITY_SECRET: ${CYNEXUS_TRUSTED_IDENTITY_SECRET:-}
    ports:
      - "127.0.0.1:18082:18082"
    networks: [cynexus-shared]

  ai:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-ai/cynexus-ai-starter
        JAR_NAME: cynexus-ai-starter-${CYNEXUS_MAVEN_VERSION:-1.1.1-ALPHA-260716-SNAPSHOT}.jar
    image: cynexus-ai:${CYNEXUS_RELEASE_VERSION:-1.1.1-ALPHA-260716-RELEASE}
    container_name: cynexus-release-ai
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: cynexus-nacos:8848
      POSTGRES_HOST: cynexus-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cynexus
      POSTGRES_SCHEMA: cynexus_appl_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: C020611.
      REDIS_HOST: cynexus-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: C020611.
      CYNEXUS_AI_CUSTOM_API_KEY: ${CYNEXUS_AI_CUSTOM_API_KEY:-}
      CYNEXUS_AI_DEEPSEEK_API_KEY: ${CYNEXUS_AI_DEEPSEEK_API_KEY:-}
      CYNEXUS_AI_DEEPSEEK_LIVE_LIMIT: ${CYNEXUS_AI_DEEPSEEK_LIVE_LIMIT:--1}
      CYNEXUS_AI_MARKET_BASE_URL: ${CYNEXUS_AI_MARKET_BASE_URL:-http://market:18082}
      CYNEXUS_AI_LANGFUSE_ENABLED: ${CYNEXUS_AI_LANGFUSE_ENABLED:-false}
      CYNEXUS_AI_LANGFUSE_BASE_URL: ${CYNEXUS_AI_LANGFUSE_BASE_URL:-http://cynexus-langfuse-web:3000}
      CYNEXUS_AI_LANGFUSE_PUBLIC_KEY: ${CYNEXUS_AI_LANGFUSE_PUBLIC_KEY:-}
      CYNEXUS_AI_LANGFUSE_SECRET_KEY: ${CYNEXUS_AI_LANGFUSE_SECRET_KEY:-}
      CYNEXUS_AI_PROVIDER_ALLOWED_ORIGINS: ${CYNEXUS_AI_PROVIDER_ALLOWED_ORIGINS:-https://api.openai.com,https://api.deepseek.com,https://am.xtyooo.top,https://dashscope.aliyuncs.com}
      CYNEXUS_AI_LANGFUSE_ALLOWED_ORIGINS: ${CYNEXUS_AI_LANGFUSE_ALLOWED_ORIGINS:-http://cynexus-langfuse-web:3000}
      CYNEXUS_TRUSTED_IDENTITY_SECRET: ${CYNEXUS_TRUSTED_IDENTITY_SECRET:-}
      CYNEXUS_AI_AGENT_ALLOW_ANONYMOUS_OWNER: "false"
      CYNEXUS_AI_AGENT_GOVERNANCE_PRINCIPALS: ${CYNEXUS_AI_AGENT_GOVERNANCE_PRINCIPALS:-workspace-user}
      HTTP_PROXY: ${CYNEXUS_HTTP_PROXY:-}
      HTTPS_PROXY: ${CYNEXUS_HTTPS_PROXY:-}
      ALL_PROXY: ${CYNEXUS_HTTPS_PROXY:-}
      NO_PROXY: ${CYNEXUS_NO_PROXY:-localhost,127.0.0.1,cynexus-postgres,cynexus-redis,cynexus-nacos,cynexus-market,cynexus-core,cynexus-data-job-executor}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18081:18081"
    networks: [cynexus-shared]

  gateway:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.app
      args:
        MAVEN_PROJECT: cynexus-gateway/cynexus-gateway-starter
        JAR_NAME: cynexus-gateway-starter-${CYNEXUS_MAVEN_VERSION:-1.1.1-ALPHA-260716-SNAPSHOT}.jar
    image: cynexus-gateway:${CYNEXUS_RELEASE_VERSION:-1.1.1-ALPHA-260716-RELEASE}
    container_name: cynexus-release-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: cynexus-nacos:8848
      CYNEXUS_TRUSTED_IDENTITY_SECRET: ${CYNEXUS_TRUSTED_IDENTITY_SECRET:-}
      CYNEXUS_GATEWAY_PRINCIPAL: ${CYNEXUS_GATEWAY_PRINCIPAL:-workspace-user}
      CYNEXUS_GATEWAY_TENANT: ${CYNEXUS_GATEWAY_TENANT:-default}
    ports:
      - "127.0.0.1:18000:18000"
    networks: [cynexus-shared]

  ui:
    build:
      context: ../..
      dockerfile: deploy/release/Dockerfile.ui
    image: cynexus-ui:${CYNEXUS_RELEASE_VERSION:-1.1.1-ALPHA-260716-RELEASE}
    container_name: cynexus-release-ui
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:5173:80"
    networks: [cynexus-shared]

networks:
  cynexus-shared:
    external: true
    name: cynexus-dev_default
