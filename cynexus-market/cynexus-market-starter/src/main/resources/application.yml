server:
  port: 18082

spring:
  autoconfigure:
    exclude:
      - org.jobrunr.spring.autoconfigure.JobRunrAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrInMemoryStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrMongoDBStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrDocumentDBStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.storage.JobRunrSqlStorageAutoConfiguration
      - org.jobrunr.spring.autoconfigure.metrics.JobRunrMetricsAutoConfiguration
  application:
    name: cynexus-market
  config:
    import:
      - optional:nacos:cynexus-market.yml
      - optional:nacos:cynexus-common.yml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: true
        register-enabled: true
        service: ${spring.application.name}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
        ephemeral: true
        metadata:
          management.port: ${server.port}
      config:
        enabled: true
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:25433}/${POSTGRES_DB_MARKET:${POSTGRES_DB:cynexus}}?currentSchema=${POSTGRES_SCHEMA:cynexus_appl_market}"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:C020611.}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:C020611.}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

jobrunr:
  job-scheduler:
    enabled: false
  background-job-server:
    enabled: false
  dashboard:
    enabled: false
