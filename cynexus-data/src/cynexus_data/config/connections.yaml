connections:
  clickhouse_default:
    type: clickhouse
    host: ${CLICKHOUSE_HOST:127.0.0.1}
    port: ${CLICKHOUSE_HTTP_PORT:28123}
    database: ${CLICKHOUSE_DATABASE:cynexus}
    username: ${CLICKHOUSE_USER:cynexus}
    password: ${CLICKHOUSE_PASSWORD:C020611.}
    timeout: 1800

  postgres_default:
    type: postgres
    url: ${DATABASE_URL:postgresql+psycopg://postgres:C020611.@127.0.0.1:25433/cynexus}
    schema: ${POSTGRES_SCHEMA:cynexus_appl_market}

  postgres_market:
    type: postgres
    url: ${MARKET_DATABASE_URL:${DATABASE_URL:postgresql+psycopg://postgres:C020611.@127.0.0.1:25433/cynexus}}
    schema: ${POSTGRES_MARKET_SCHEMA:cynexus_appl_market}

  postgres_core:
    type: postgres
    url: ${CORE_DATABASE_URL:${DATABASE_URL:postgresql+psycopg://postgres:C020611.@127.0.0.1:25433/cynexus}}
    schema: ${POSTGRES_CORE_SCHEMA:cynexus_appl_core}

  redis_default:
    type: redis
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:C020611.}
    database: ${REDIS_DB:0}
    timeout: ${REDIS_TIMEOUT:2}

  duckdb_default:
    type: duckdb
    path: ${DUCKDB_PATH:var/market_data.duckdb}

  tdx_local:
    type: filesystem
    root_path: ${TDX_ROOT:D:/Program File/tdx}

  eastmoney_default:
    type: http
    base_url: https://push2.eastmoney.com
    timeout: 10
    retry: 3

  eastmoney_history:
    type: http
    base_url: https://push2his.eastmoney.com
    timeout: 10
    retry: 3

  akshare_default:
    type: python
    timeout: 30

  exchange_margin_default:
    type: http
    base_url: https://www.sse.com.cn
    timeout: 15
    retry: 3

  tencent_default:
    type: http
    base_url: https://web.ifzq.gtimg.cn
    timeout: 10
    retry: 3

  sina_default:
    type: http
    base_url: https://money.finance.sina.com.cn
    timeout: 10
    retry: 3

  sina_futures_default:
    type: http
    base_url: https://vip.stock.finance.sina.com.cn
    timeout: 15
    retry: 2

  ths_default:
    type: http
    base_url: https://data.10jqka.com.cn
    timeout: 10
    retry: 3

  social_browser:
    type: browser
    root_path: ${CYNEXUS_SOCIAL_PROFILE_ROOT:var}
    timeout: ${CYNEXUS_SOCIAL_TIMEOUT_SECONDS:30}
    extra:
      headless: ${CYNEXUS_SOCIAL_HEADLESS:true}
      wait_ms: 2500
      scroll_rounds: 12
      scroll_wait_ms: 900
      executable_path: ${CYNEXUS_PLAYWRIGHT_EXECUTABLE_PATH:}
      post_link_selectors:
        xiaohongshu: "a[href*='/explore/'], a[href*='/discovery/item/']"
        douyin: "a[href*='/video/'], a[href*='/note/']"
      comment_selectors:
        xiaohongshu: ".comment-item"
        douyin: "[data-e2e='comment-item']"
      opencli_package: "${CYNEXUS_OPENCLI_PACKAGE:@jackwener/opencli@1.8.6}"
      opencli_timeout_seconds: ${CYNEXUS_OPENCLI_TIMEOUT_SECONDS:120}
      opencli_login_timeout_seconds: ${CYNEXUS_OPENCLI_LOGIN_TIMEOUT_SECONDS:300}
      opencli_post_limit: ${CYNEXUS_OPENCLI_POST_LIMIT:15}
      opencli_comment_limit: ${CYNEXUS_OPENCLI_COMMENT_LIMIT:50}
      opencli_publish_date_probe_wait_seconds: ${CYNEXUS_OPENCLI_PUBLISH_DATE_PROBE_WAIT_SECONDS:2}
      opencli_executable: "${CYNEXUS_OPENCLI_EXECUTABLE:}"
      cdp_host: ${CYNEXUS_SOCIAL_CDP_HOST:127.0.0.1}
      cdp_port: ${CYNEXUS_SOCIAL_CDP_PORT:19221}
      cdp_post_limit: ${CYNEXUS_SOCIAL_CDP_POST_LIMIT:20}
