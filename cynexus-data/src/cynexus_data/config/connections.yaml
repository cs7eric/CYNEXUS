    base_url: https://www.sse.com.cn
    timeout: 15
    retry: 3

  tencent_default:
    type: http
    base_url: https://web.ifzq.gtimg.cn
    timeout: 10
    retry: 3

  sina_default:
    type: http
    base_url: https://money.finance.sina.com.cn
    timeout: 10
    retry: 3

  ths_default:
    type: http
    base_url: https://data.10jqka.com.cn
