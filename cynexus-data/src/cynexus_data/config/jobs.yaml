jobs:
  health_check:
    description: Check Python job executor runtime and optional storage health.
    params:
      check_storage: optional

  trigger_probe:
    description: Echo a trigger request for Java/Core to data-job-executor E2E smoke tests.
    params:
      any: optional

  sync_metadata:
    description: Sync metadata bundle by delegating to stock-basic sync in this foundation pass.
    params:
      trade_date: optional
      force: optional

  sync_a_stock_dataset:
    description: Sync Phase 34 A-stock source datasets into PostgreSQL or ClickHouse with provider-aware throttling.
    params:
      dataset: required; one dataset key, e.g. eastmoney_fund_flow_minute
      datasets: optional; comma-separated dataset keys
      codes: optional; comma-separated stock codes for stock-scoped datasets
      code: optional; single stock code
      trade_date: optional
      snapshot_date: optional
      create_table: optional
      fetch_live: optional; dry-run defaults to false, live runs default to true
      request_sleep_seconds: optional; overrides provider default anti-scraping interval
      batch_limit: optional
      limit_codes: optional
      max_pages: optional
      page_size: optional
      top: optional
      top_n: optional
      pool: optional
      period: optional
      query: optional
      channel: optional
      option_code: optional
      underlying: optional
      call: optional
      payload: optional; test/dry-run payload
      payloads: optional; per-dataset test payload map
      cailian_telegraph: market-level Cailian Press telegraph feed
      cninfo_market_announcements: macro/policy announcements from CNInfo
      cninfo_regulatory_announcements: regulatory letters, inquiries, penalties, and disciplinary notices from CNInfo
      official_market_information: government, central-bank, statistics, regulator, exchange, and media market headlines
      market_information_content_backfill_limit: optional; bounded recent full-text retry count with a six-hour cooldown

  sync_trade_calendar:
    description: Sync trade calendar data.
    params:
      start_date: optional
      end_date: optional
      providers: optional
      create_table: optional
      extra_holidays: optional
      extra_workdays: optional
      source: optional

  sync_stock_basic:
    description: Sync stock basic information.
    params:
      providers: optional
      codes: optional
      symbols: optional
      limit: optional
      create_table: optional
      force: optional

  sync_stock_sectors:
    description: Sync stock to industry/concept/style sector mappings from eltdx topics.
    params:
      codes: optional
      symbols: optional
      limit_codes: optional
      create_table: optional
      pool_size: optional
      timeout: optional
      workers: optional
      shard_size: optional
      batch_size: optional
      sleep_first: optional
      sleep_retry: optional
      max_retry_rounds: optional
      batch_timeout_seconds: optional
      replace_empty: optional
      trading_day_only: optional
      hosts: optional

  sync_stock_turnover:
    description: Sync per-stock turnover-rate series snapshots into PostgreSQL.
    params:
      codes: optional
      symbols: optional
      target_type: optional
      period: optional
      adjust: optional
      limit: optional
      bar_limit: optional
      limit_codes: optional
      create_table: optional
      bars_by_code: optional
      shares_by_code: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  sync_ths_industry_constituents:
    description: Sync THS industry constituent snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      industry_codes: optional
      codes: optional
      history_path: optional
      create_table: optional
      max_pages: optional
      page_sleep: optional

  sync_kline_daily:
    description: Sync daily kline records.
    params:
      trade_date: optional
      start_date: optional
      end_date: optional
      codes: optional
      providers: optional
      force: optional
      resume: optional
      checkpoint_prefix: optional

  sync_adjusted_kline_daily:
    description: Sync adjusted daily kline records from eltdx into daily_qfq/daily_hfq.
    params:
      adjust: optional
      adjusts: optional
      trade_date: optional
      start_date: optional
      end_date: optional
      codes: required
      symbols: optional
      limit_codes: optional
      create_table: optional
      resume: optional
      checkpoint_prefix: optional

  sync_index_daily_raw_from_daily_raw:
    description: Maintain index_daily_raw from daily_raw index rows after raw daily sync.
    params:
      trade_date: optional
      date: optional
      start_date: optional
      end_date: optional
      index_codes: optional
      codes: optional
      source_table: optional
      target_table: optional
      create_table: optional

  sync_kline_minute:
    description: Sync minute kline records.
    params:
      trade_date: optional
      date: optional
      start_date: optional
      end_date: optional
      codes: optional
      symbols: optional
      providers: optional
      target_type: optional
      period: optional
      limit: optional
      tdx_root: optional
      limit_files: optional
      create_table: optional
      replace_existing: optional
      batch_size: optional

  sync_tdx_hsjday:
    description: Download, verify, extract, and atomically replace local TDX hsjday daily files.
    params:
      date: optional
      trade_date: optional
      url: optional
      zip_path: optional
      work_dir: optional
      target_root: optional
      extract_dir: optional
      skip_download: optional
      keep_zip: optional
      timeout_seconds: optional
      download_method: optional
      playwright_headless: optional
      playwright_wait_ms: optional
      chunk_size_bytes: optional
      urlopen_attempts: optional
      urlopen_backoff_seconds: optional

  sync_tdx_intraday_detail:
    description: Sync eltdx auction points and historical 1m timeshare details into ClickHouse.
    params:
      trade_date: optional
      datasets: optional
      dataset: optional
      auction_phase: optional
      auction_phases: optional
      codes: optional
      symbols: optional
      target_type: optional
      create_table: optional
      resume: optional
      ignore_errors: optional
      checkpoint_prefix: optional
      timeout_seconds: optional
      eltdx_timeout: optional
      batch_size: optional
      limit_codes: optional

  aggregate_kline_periods:
    description: Aggregate 1m kline into higher periods.
    params:
      periods: optional
      trade_date: optional
      codes: optional

  sync_fund_flow:
    description: Sync THS sector fund-flow snapshots into PostgreSQL.
    params:
      trade_date: optional
      scope: optional
      providers: optional
      provider: optional
      history_path: optional
      create_table: optional
      max_pages: optional
      page_sleep: optional

  sync_stock_fund_flow:
    description: Sync Tencent stock fund-flow snapshots into PostgreSQL.
    params:
      trade_date: optional
      providers: optional
      provider: optional
      codes: optional
      symbols: optional
      code_source: optional; self_selected/watchlist, stock_basic/all/active
      history_path: optional
      create_table: optional
      batch_size: optional

  build_index_returns:
    description: Build broad-index window return snapshots from ClickHouse index_daily_raw into PostgreSQL.
    params:
      trade_date: optional
      window_days: optional
      days: optional
      source_table: optional
      lookback_days: optional
      create_table: optional
      targets: optional
      rows_by_code: optional
      rows: optional

  sync_tdx_industry_quotes:
    description: Sync TDX 56 industry index quote snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      create_table: optional
      rows: optional
      mapping: optional
      batch_size: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  sync_tdx_industry_fund_flow:
    description: Sync TDX 56 industry fund-flow daily snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      codes: optional
      code: optional
      rows: optional
      create_table: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  sync_tdx_sector_quote_details:
    description: Sync TDX sector theme-market detail snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      codes: optional
      code: optional
      mapping: optional
      datasets: optional
      dataset: optional
      rows: optional
      create_table: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  build_market_heatmap:
    description: Build UI-ready market heatmap JSON snapshot from industry quote rows.
    params:
      snapshot_date: optional
      trade_date: optional
      kind: optional
      source: optional
      quote_source: optional
      top_n: optional
      topN: optional
      rows: optional
      create_table: optional

  build_market_pulse:
    description: Build market pulse sector snapshots from fund-flow data.
    params:
      trade_date: optional
      create_table: optional
      rows: optional

  build_style_sector:
    description: Build style-sector equal-weight change snapshots from stock-sector mappings and Tencent realtime quotes.
    params:
      trade_date: optional
      create_table: optional
      sectors: optional
      quotes_by_code: optional
      batch_size: optional
      batch_sleep: optional

  build_market_overview:
    description: Build or merge one market overview daily snapshot.
    params:
      trade_date: optional
      source: optional
      create_table: optional
      fetch_live: optional
      eltdx_timeout: optional
      timeout_seconds: optional
      max_pages: optional
      page_size: optional
      page_sleep: optional
      eastmoney_max_pages: optional
      eastmoney_page_size: optional
      eastmoney_page_sleep: optional
      codes: optional
      symbols: optional
      batch_size: optional
      batch_sleep: optional
      tencent_batch_size: optional
      tencent_batch_sleep: optional
      fields: optional
      totalAmount: optional
      mainNetInflow: optional

  build_market_overview_detail:
    description: Build market overview technical/detail JSON snapshot from daily bars and breadth snapshots.
    params:
      trade_date: optional
      benchmark_code: optional
      source_table: optional
      lookback_days: optional
      create_table: optional
      benchmark_rows: optional
      rows: optional
      index_bars_map: optional
      style_indices: optional
      today_breadth: optional
      breadth_series: optional
      industry_rows: optional

  sync_margin:
    description: Sync margin trading data from AkShare.
    params:
      trade_date: optional
      providers: optional; defaults to exchange,akshare
      provider_priority: optional
      datasets: optional
      create_table: optional
      mode: optional; stock_history uses EastMoney Datacenter for watchlist history
      codes: optional
      code_source: optional; self_selected/watchlist
      limit_codes: optional
      page_size: optional; defaults to 120

  build_sector_breadth:
    description: Build MSI sector breadth from sector fund-flow snapshots.
    params:
      trade_date: optional
      create_table: optional
      advancing: optional
      declining: optional
      flat: optional
      total: optional

  build_ma_count:
    description: Build MSI MA count, price-strength, and breadth raw inputs from daily_qfq.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      rows: optional

  build_profit_effect:
    description: Build MSI profit-effect factor from MA count up-5d and new-low-60d percentages.
    params:
      trade_date: optional
      create_table: optional
      up_5d_pct: optional
      new_low_60d_pct: optional

  build_turnover_activity:
    description: Build MSI turnover-activity factor from Shanghai/Shenzhen index amount rows.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      window: optional
      rows: optional
      score: optional

  build_volatility_sentiment:
    description: Build MSI volatility-sentiment factor from index close series.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      underlying_code: optional
      underlying_name: optional
      window: optional
      lookback: optional
      rows: optional

  build_risk_appetite:
    description: Build MSI risk-appetite factor from HS300 and treasury ETF returns.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      window: optional
      score: optional
      hs300_rows: optional
      treasury_511010_rows: optional
      treasury_511090_rows: optional

  build_style_risk:
    description: Build MSI style-risk factor from CSI1000 versus HS300 returns.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      window: optional
      score: optional
      hs300_rows: optional
      csi1000_rows: optional

  build_limit_emotion:
    description: Build MSI limit-emotion factor from daily limit-up/limit-down snapshots.
    params:
      trade_date: optional
      prev_trade_date: optional
      create_table: optional
      source_table: optional
      rows: optional
      today_rows: optional
      prev_rows: optional
      score_overrides: optional
      streak_lookback_days: optional

  build_msi:
    description: Build market sentiment index for one trading date.
    params:
      trade_date: optional
      force: optional
      require_full: optional
      create_table: optional
      components: optional

  market_sentiment_chain_refresh:
    description: Run the full market sentiment refresh chain and report per-step progress.
    params:
      trade_date: optional
      target_date: optional
      snapshot_date: optional
      create_table: optional
      force: optional
      require_full: optional
      codes: optional
      limit_codes: optional
      limit_files: optional
      skip_download: optional
      urlopen_attempts: optional
      urlopen_backoff_seconds: optional

  rebuild_msi:
    description: Rebuild market sentiment index over a date range.
    params:
      start_date: optional
      end_date: optional
      force: optional
      require_full: optional
      create_table: optional

  backfill_history:
    description: Backfill historical market data.
    params:
      start_date: optional
      end_date: optional
      dataset: optional
      providers: optional

  repair_missing_data:
    description: Repair missing records for a dataset.
    params:
      dataset: optional
      trade_date: optional
      force: optional

  quality_check:
    description: Run data-quality checks.
    params:
      checks: optional
      dataset: optional

  transcribe_media:
    description: Convert MP4 or audio input to transcript only.
    params:
      input_uri: required
      transcript_id: optional
      biz_id: optional
      language: optional
      force: optional
      create_table: optional
      work_dir: optional
      ffmpeg_path: optional
      transcriber: optional
      transcript_text: optional
