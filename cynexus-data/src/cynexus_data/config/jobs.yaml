jobs:
  health_check:
    description: Check Python job executor runtime and optional storage health.
    params:
      check_storage: optional

  trigger_probe:
    description: Echo a trigger request for Java/Core to data-job-executor E2E smoke tests.
    params:
      any: optional

  margin_update_probe:
    description: Probe exchange margin freshness every ten minutes and run the full margin sync only after a new trade date is available.
    params:
      providers: optional; defaults to exchange,akshare
      datasets: optional; defaults to summary,detail,account
      create_table: optional
      enrich_detail: optional

  sync_futures_position:
    description: Sync exchange-published futures member volume, long, and short position rankings into PostgreSQL.
    params:
      trade_date: optional; YYYY-MM-DD or YYYYMMDD
      providers: optional; defaults to akshare,sina and is evaluated per exchange
      exchanges: optional; CFFEX, SHFE, CZCE, DCE, GFEX, INE
      varieties: optional; comma-separated variety filters
      create_table: optional
      dry_run: optional
      latest_source_data: optional; when true or trade_date is omitted, resolve the newest date returned by configured sources
      lookback_days: optional; calendar-day search window for latest source data and short missing-date recovery, defaults to 10

  sync_metadata:
    description: Sync metadata bundle by delegating to stock-basic sync in this foundation pass.
    params:
      trade_date: optional
      force: optional

  sync_a_stock_dataset:
    description: Sync Phase 34 A-stock source datasets into PostgreSQL or ClickHouse with provider-aware throttling.
    params:
      dataset: required; one dataset key, e.g. eastmoney_fund_flow_minute
      datasets: optional; comma-separated dataset keys
      codes: optional; comma-separated stock codes for stock-scoped datasets
      code: optional; single stock code
      trade_date: optional
      snapshot_date: optional
      create_table: optional
      fetch_live: optional; dry-run defaults to false, live runs default to true
      request_sleep_seconds: optional; overrides provider default anti-scraping interval
      batch_limit: optional
      limit_codes: optional
      max_pages: optional
      page_size: optional
      top: optional
      top_n: optional
      pool: optional
      period: optional
      query: optional
      channel: optional
      option_code: optional
      underlying: optional
      call: optional
      payload: optional; test/dry-run payload
      payloads: optional; per-dataset test payload map
      cailian_telegraph: market-level Cailian Press telegraph feed
      cninfo_market_announcements: macro/policy announcements from CNInfo
      cninfo_regulatory_announcements: regulatory letters, inquiries, penalties, and disciplinary notices from CNInfo
      official_market_information: government, central-bank, statistics, regulator, exchange, and media market headlines
      market_information_content_backfill_limit: optional; bounded recent full-text retry count with a six-hour cooldown

  a_stock_fund_flow_history_backfill:
    description: Incrementally sync stock fund-flow history through easy_tdx with EastMoney fallback. Supports historical limit-up scope and remaining-active scope.
    params:
      shard_size: optional; defaults to 300; set 0 or run_all=true to process the full scope in one run
      run_all: optional; process every pending stock in the selected scope
      batch_sleep_seconds: optional; when run_all=true and shard_size > 0, sleep between internal batches
      stock_scope: optional; all-active, limit-up-history, remaining-active, or missing-120
      fund_flow_count: optional; defaults to 5 after the initial 120-day bootstrap
      minimum_history_rows: optional; defaults to 120 for missing-120 scope
      fund_flow_workers: optional; defaults to 6, bounded to 1..8
      codes: optional; explicit stock codes override the active-stock universe
      checkpoint_scope: optional; stable checkpoint namespace
      create_table: optional
      provider_timeout: optional

  a_stock_fund_flow_daily_qc:
    description: Sequential same-day QC comparing easy_tdx and EastMoney stock fund-flow for a randomized 50-symbol market sample.
    params:
      sample_size: optional; defaults to 50 and is capped at 50
      sample_seed: optional; omit for a different randomized sample each run
      sample_date: optional; defaults to today
      codes: optional; explicit stock codes override the randomized active-stock sample
      create_table: optional
      provider_timeout: optional; defaults to 15
      request_sleep_seconds: optional; extra sleep between sampled symbols

  sync_trade_calendar:
    description: Sync trade calendar data.
    params:
      start_date: optional
      end_date: optional
      providers: optional
      create_table: optional
      extra_holidays: optional
      extra_workdays: optional
      source: optional

  materialize_stock_screening_facts:
    description: Materialize replayable A-share daily Screener facts from ClickHouse daily_raw into PostgreSQL. This is a bounded data-maintenance job, not a user-facing query or Agent tool.
    params:
      trade_date: optional; defaults to latest available daily_raw trade date
      start_date: optional; inclusive historical backfill start
      end_date: optional; inclusive historical backfill end
      source_table: optional; defaults to daily_raw
      batch_size: optional; PostgreSQL upsert batch size, defaults to 2000
      checkpoint_key: optional; defaults to a_stock.stock_screening_fact.watermark

  materialize_market_factor_snapshots:
    description: Materialize point-in-time daily primitive observations for event-factor research.
    params:
      trade_date: optional
      start_date: optional
      end_date: optional
      batch_size: optional; PostgreSQL upsert batch size, defaults to 2000
      checkpoint_key: optional; defaults to a_stock.market_factor_snapshot.watermark

  materialize_market_factor_membership_snapshots:
    description: Materialize historical THS membership snapshots as of a requested research trade date.
    params:
      trade_date: optional; defaults to today
      checkpoint_key: optional; defaults to a_stock.market_factor_membership.watermark

  materialize_market_event_intraday_snapshots:
    description: Materialize bounded event-aligned stock 1m primitives; market and industry scopes remain explicit partial coverage until their point-in-time sources are materialized.
    params:
      code: required; six-digit A-share code
      trade_date: required; YYYY-MM-DD
      anchor_at: optional; ISO-8601 event anchor, defaults to Shanghai close
      pre_minutes: optional; default 120, range 1 to 240
      post_minutes: optional; default 30, range 0 to 60
      checkpoint_key: optional

  sync_stock_basic:
    description: Sync stock basic information.
    params:
      providers: optional
      codes: optional
      symbols: optional
      limit: optional
      create_table: optional

      force: optional

  sync_stock_sectors:
    description: Sync stock to industry/concept/style sector mappings from eltdx topics.
    params:
      codes: optional
      symbols: optional
      limit_codes: optional
      create_table: optional
      pool_size: optional
      timeout: optional
      workers: optional
      shard_size: optional
      batch_size: optional
      sleep_first: optional
      sleep_retry: optional
      max_retry_rounds: optional
      batch_timeout_seconds: optional
      replace_empty: optional
      trading_day_only: optional
      hosts: optional

  sync_stock_turnover:
    description: Sync per-stock turnover-rate series snapshots into PostgreSQL.
    params:
      codes: optional
      symbols: optional
      target_type: optional
      period: optional
      adjust: optional
      limit: optional
      bar_limit: optional
      limit_codes: optional
      create_table: optional
      bars_by_code: optional
      shares_by_code: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  sync_ths_industry_constituents:
    description: Sync THS industry constituent snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      industry_codes: optional
      codes: optional
      history_path: optional
      create_table: optional
      max_pages: optional
      page_sleep: optional

  sync_kline_daily:
    description: Sync daily kline records.
    params:
      trade_date: optional
      start_date: optional
      end_date: optional
      codes: optional
      providers: optional
      force: optional
      resume: optional
      checkpoint_prefix: optional

  sync_adjusted_kline_daily:
    description: Sync adjusted daily kline records from eltdx into daily_qfq/daily_hfq.
    params:
      adjust: optional
      adjusts: optional
      trade_date: optional
      start_date: optional
      end_date: optional
      codes: required
      symbols: optional
      limit_codes: optional
      create_table: optional
      resume: optional
      checkpoint_prefix: optional

  sync_index_daily_raw_from_daily_raw:
    description: Maintain index_daily_raw from daily_raw index rows after raw daily sync.
    params:
      trade_date: optional
      date: optional
      start_date: optional
      end_date: optional
      index_codes: optional
      codes: optional
      source_table: optional
      target_table: optional
      create_table: optional
      allow_full_history: optional; false by default. Requires explicit confirmation before a full-history FINAL read and replacement.

  sync_kline_minute:
    description: Sync minute kline records incrementally from the last effective ClickHouse date by default.
    params:
      trade_date: optional
      date: optional
      start_date: optional
      end_date: optional
      codes: optional
      symbols: optional
      providers: optional
      target_type: optional
      period: optional
      limit: optional
      tdx_root: optional
      limit_files: optional
      create_table: optional
      replace_existing: optional
      batch_size: optional
      incremental: optional; TDX defaults to true and resumes after the last effective ClickHouse date; set false only for an intentional full read

  sync_tdx_hsjday:
    description: Download, verify, extract, and atomically replace local TDX hsjday daily files.
    params:
      date: optional
      trade_date: optional
      url: optional
      zip_path: optional
      work_dir: optional
      target_root: optional
      extract_dir: optional
      skip_download: optional
      keep_zip: optional
      timeout_seconds: optional
      download_method: optional
      playwright_headless: optional
      playwright_wait_ms: optional
      chunk_size_bytes: optional
      urlopen_attempts: optional
      urlopen_backoff_seconds: optional

  sync_tdx_intraday_detail:
    description: Sync auction and historical intraday details using easy_tdx or eltdx into ClickHouse.
    params:
      trade_date: optional
      datasets: optional
      dataset: optional
      auction_phase: optional
      auction_phases: optional
      codes: optional
      symbols: optional
      target_type: optional
      create_table: optional
      resume: optional
      ignore_errors: optional
      checkpoint_prefix: optional
      timeout_seconds: optional
      eltdx_timeout: optional
      batch_size: optional
      limit_codes: optional
      replace_existing: optional; false by default. Set true only for a bounded repair that must physically replace existing rows.
      provider: optional; easy_tdx or eltdx, default eltdx; easy_tdx is available for timeshare

  sync_trade_review_timeshare:
    description: Archive selected stock, ETF, index, and review-context timeshare series with exact-date semantics.
    params:
      trade_date: required; YYYY-MM-DD
      codes: optional; comma-separated bounded symbols; omitted builds limit/THS selection pools
      etf_codes: optional; comma-separated ETF symbols to archive in the same run
      context_symbols: optional; defaults to 000001,399001,399006
      timeout_seconds: optional; defaults to 15
      redis_cache: optional; defaults to true
      redis_ttl_seconds: optional; defaults to 604800
      ignore_errors: optional; defaults to true

  rebuild_kline_1m_partitions:
    description: Rebuild selected damaged 1m ClickHouse year partitions from local Parquet with bounded Arrow inserts.
    params:
      years: required; bounded calendar years, preferably one year per execution
      execute: optional; false performs staging validation only
      source_dir: optional
      stage_table: optional
      keep_stage: optional
      batch_rows: optional; execution is capped at 25000 unless allow_high_memory=true
      flush_rows: optional; execution is capped at 100000 unless allow_high_memory=true
      workers: optional; execution uses one worker unless allow_high_memory=true
      max_partitions_per_insert_block: optional
      allow_high_memory: optional; explicit maintenance override, disabled by default

  aggregate_kline_periods:
    description: Aggregate 1m kline into higher periods.
    params:
      periods: optional
      trade_date: optional
      codes: optional
      start_date: optional
      end_date: optional
      allow_full_history: optional; false by default. Requires explicit confirmation before a full-history aggregation and replacement.

  sync_fund_flow:
    description: Sync THS sector fund-flow snapshots into PostgreSQL.
    params:
      trade_date: optional
      scope: optional
      providers: optional
      provider: optional
      history_path: optional
      create_table: optional
      max_pages: optional
      page_sleep: optional

  sync_stock_fund_flow:
    description: Sync Tencent or easy_tdx stock fund-flow snapshots into PostgreSQL.
    params:
      trade_date: optional
      providers: optional
      provider: optional; tencent or easy_tdx
      codes: optional
      symbols: optional
      code_source: optional; self_selected/watchlist, stock_basic/all/active
      history_path: optional
      create_table: optional
      batch_size: optional

  build_index_returns:
    description: Build broad-index window return snapshots from ClickHouse index_daily_raw into PostgreSQL.
    params:
      trade_date: optional
      window_days: optional
      days: optional
      source_table: optional
      lookback_days: optional
      create_table: optional
      targets: optional
      rows_by_code: optional
      rows: optional

  sync_tdx_industry_quotes:
    description: Sync TDX 56 industry index quote snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      create_table: optional
      rows: optional
      mapping: optional
      batch_size: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  sync_tdx_industry_fund_flow:
    description: Sync TDX 56 industry fund-flow daily snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      codes: optional
      code: optional
      rows: optional
      create_table: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  sync_tdx_sector_quote_details:
    description: Sync TDX sector theme-market detail snapshots into PostgreSQL.
    params:
      snapshot_date: optional
      trade_date: optional
      codes: optional
      code: optional
      mapping: optional
      datasets: optional
      dataset: optional
      rows: optional
      create_table: optional
      pool_size: optional
      timeout: optional
      timeout_seconds: optional
      source: optional

  build_market_heatmap:
    description: Build UI-ready market heatmap JSON snapshot from industry quote rows.
    params:
      snapshot_date: optional
      trade_date: optional
      kind: optional
      source: optional
      quote_source: optional
      top_n: optional
      topN: optional
      rows: optional
      create_table: optional

  build_market_pulse:
    description: Build market pulse sector snapshots from fund-flow data.
    params:
      trade_date: optional
      create_table: optional
      rows: optional

  build_style_sector:
    description: Build style-sector equal-weight change snapshots from stock-sector mappings and Tencent realtime quotes.
    params:
      trade_date: optional
      create_table: optional
      sectors: optional
      quotes_by_code: optional
      batch_size: optional
      batch_sleep: optional

  build_market_overview:
    description: Build or merge one market overview daily snapshot.
    params:
      trade_date: optional
      source: optional
      create_table: optional
      fetch_live: optional
      eltdx_timeout: optional
      timeout_seconds: optional
      max_pages: optional
      page_size: optional
      page_sleep: optional
      eastmoney_max_pages: optional
      eastmoney_page_size: optional
      eastmoney_page_sleep: optional
      codes: optional
      symbols: optional
      batch_size: optional
      batch_sleep: optional
      tencent_batch_size: optional
      tencent_batch_sleep: optional
      fields: optional
      totalAmount: optional
      mainNetInflow: optional

  sync_market_fund_flow:
    description: Sync EastMoney market-wide fund-flow daily history into market overview snapshots.
    params:
      limit: optional; EastMoney daily rows to request, default 120
      create_table: optional

  sync_market_etf:
    description: Sync ETF spot, IOPV, premium/discount, activity, and daily share-flow proxies into PostgreSQL.
    params:
      trade_date: optional
      snapshot_date: optional
      create_table: optional
      refresh_classification: optional; refresh the best-effort fund/index classification catalog, default false

  sync_limit_up_fund_flow_minute_archive:
    description: Fetch EastMoney minute fund-flow for historical limit-up stocks in small checkpointed shards and archive the latest full-day minute as daily fallback history.
    params:
      trade_date: optional; defaults to today
      create_table: optional
      fetch_live: optional; dry-run defaults to false, live runs default to true
      ignore_errors: optional; defaults to true
      shard_size: optional; per-run stock count, default 80
      limit_codes: optional; alias of shard_size for compatibility
      code_pool_limit: optional; cap historical limit-up stock pool size before sharding
      code_offset: optional; manual offset override into historical limit-up stock pool
      checkpoint_key: optional; round-robin checkpoint key, default a_stock.sync_limit_up_fund_flow_minute_archive.round_robin
      codes: optional; explicit stock code list override
      request_sleep_seconds: optional; extra sleep after each stock request, default 0.5
      provider_timeout_seconds: optional; EastMoney request timeout, default 8
      max_runtime_seconds: optional; clean stop and checkpoint after this runtime, default 1200
      batch_flush_successes: optional; flush ClickHouse after this many successful stocks, default 10
      fetch_retries: optional; per-stock retry count after the first failed request, default 1
      retry_sleep_min_seconds: optional; default 2
      retry_sleep_max_seconds: optional; default 6
      complete_after_time: optional; default 14:50:00, only archive days with a minute at or after this time
      aggregate_source: optional; default eastmoney.push2.minute_agg

  build_market_overview_detail:
    description: Build market overview technical/detail JSON snapshot from daily bars and breadth snapshots.
    params:
      trade_date: optional
      benchmark_code: optional
      source_table: optional
      lookback_days: optional
      create_table: optional
      benchmark_rows: optional
      rows: optional
      index_bars_map: optional
      style_indices: optional
      today_breadth: optional
      breadth_series: optional
      industry_rows: optional

  sync_margin:
    description: Sync margin trading data from AkShare.
    params:
      trade_date: optional
      providers: optional; defaults to exchange,akshare
      provider_priority: optional
      datasets: optional
      create_table: optional
      mode: optional; stock_history uses EastMoney Datacenter for rotating stock history
      codes: optional
      code_source: optional; self_selected/watchlist or all/active/stock_basic
      limit_codes: optional; 0 or omitted means the full active A-share universe
      batch_size: optional alias for limit_codes
      history_days: optional; minimum historical trading rows per stock, defaults to 120
      workers: optional; bounded concurrent EastMoney workers, defaults to 8
      pool_size: optional alias for workers
      request_interval: optional; per-worker EastMoney request interval in seconds, defaults to 0.35
      enrich_detail: optional; fill missing exchange fields from EastMoney latest detail
      page_size: optional; defaults to 120

  build_sector_breadth:
    description: Build MSI sector breadth from sector fund-flow snapshots.
    params:
      trade_date: optional
      create_table: optional
      advancing: optional
      declining: optional
      flat: optional
      total: optional

  build_ma_count:
    description: Build MSI MA count, price-strength, and breadth raw inputs from daily_qfq.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      rows: optional

  build_profit_effect:
    description: Build MSI profit-effect factor from MA count up-5d and new-low-60d percentages.
    params:
      trade_date: optional
      create_table: optional
      up_5d_pct: optional
      new_low_60d_pct: optional

  build_turnover_activity:
    description: Build MSI turnover-activity factor from Shanghai/Shenzhen index amount rows.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      window: optional
      rows: optional
      score: optional

  build_volatility_sentiment:
    description: Build MSI volatility-sentiment factor from index close series.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      underlying_code: optional
      underlying_name: optional
      window: optional
      lookback: optional
      rows: optional

  build_risk_appetite:
    description: Build MSI risk-appetite factor from HS300 and treasury ETF returns.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      window: optional
      score: optional
      hs300_rows: optional
      treasury_511010_rows: optional
      treasury_511090_rows: optional

  build_style_risk:
    description: Build MSI style-risk factor from CSI1000 versus HS300 returns.
    params:
      trade_date: optional
      create_table: optional
      source_table: optional
      window: optional
      score: optional
      hs300_rows: optional
      csi1000_rows: optional

  build_limit_emotion:
    description: Build MSI limit-emotion factor from daily limit-up/limit-down snapshots.
    params:
      trade_date: optional
      prev_trade_date: optional
      create_table: optional
      source_table: optional
      rows: optional
      today_rows: optional
      prev_rows: optional
      score_overrides: optional
      streak_lookback_days: optional

  build_msi:
    description: Build market sentiment index for one trading date.
    params:
      trade_date: optional
      force: optional
      require_full: optional
      create_table: optional
      components: optional

  market_sentiment_chain_refresh:
    description: Run the full market sentiment refresh chain and report per-step progress.
    params:
      trade_date: optional
      target_date: optional
      snapshot_date: optional
      create_table: optional
      force: optional
      require_full: optional
      codes: optional
      limit_codes: optional
      limit_files: optional
      skip_download: optional
      urlopen_attempts: optional
      urlopen_backoff_seconds: optional

  market_indicator_refresh:
    description: Refresh full-market 30-second confirmation snapshots, sector transmission episodes, replay facts, and conditional trade references during trading hours.
    params:
      create_table: optional
      universe_mode: optional; full_market by default, historical_limit for bounded fallback
      pool_size: optional; default 8
      batch_size: optional; default 240; TDX quote request batch, bounded fallback on failure
      limit_history_days: optional; default 365 calendar days
      limit_codes: optional; explicit test cap applied after historical-universe filtering
      timeout: optional; default 8 seconds
      quote_retry_attempts: optional; default 2 bounded provider retries
      quote_retry_backoff_seconds: optional; default 0.25 seconds with jitter
      quote_request_spacing_seconds: optional; default 0.02 seconds between batches
      quote_fallback_batch_size: optional; default 80 when a large batch repeatedly fails
      rapid_change_pct: optional; default 1 percentage point per capture
      max_gap_minutes: optional; default 10 minutes for rapid-event comparisons
      min_snapshot_ratio: optional; default 0.8; failed captures are not published
      redis_cache: optional; default true; stage capture bundles in Redis before persistence
      redis_ttl_seconds: optional; default 86400 seconds
      persistence_interval_seconds: optional; default 180 seconds before PostgreSQL flush
      max_persist_captures: optional; default 1 capture per run
      target_cadence_seconds: optional; production scheduler default is 30 seconds after the full-market workflow benchmark; effective cadence is raised when end-to-end latency exceeds the target
      signal_window_seconds: optional; default 5
      transmission_rapid_return_pct: optional; default 0.8 percentage points
      transmission_follower_return_pct: optional; default 0.3 percentage points
      source: optional
      publish_limit_board_discoveries: optional; default true; publish full-market涨跌停 discoveries to the five-second limit-board sampler
      limit_board_redis_prefix: optional; defaults to cynexus:market-indicator:limit-board:v1
      limit_board_redis_ttl_seconds: optional; defaults to 43200

  market_indicator_priority_refresh:
    description: Refresh the low-latency priority radar over the historical limit-up/down cohort; Redis-only partial output, never a complete industry confirmation.
    params:
      universe_mode: optional; historical_limit by default
      limit_codes: optional; defaults to 1500 priority symbols
      limit_history_days: optional; defaults to 365 calendar days
      pool_size: optional; defaults to 8
      batch_size: optional; defaults to 320
      timeout: optional; defaults to 8 seconds
      quote_retry_attempts: optional; defaults to 2 bounded provider retries
      quote_retry_backoff_seconds: optional; defaults to 0.25 seconds with jitter
      quote_request_spacing_seconds: optional; defaults to 0.02 seconds between batches
      quote_fallback_batch_size: optional; defaults to 80 when a large batch repeatedly fails
      target_cadence_seconds: optional; defaults to 10
      redis_prefix: optional; defaults to cynexus:market-indicator:priority
      persist_postgres: optional; defaults to false
      full_confirmation_required: optional; defaults to true
      scope: optional; defaults to priority

  market_indicator_offline_validation:
    description: Replay market indicator captures offline and validate canonical contracts and no-future-data leakage.
    params:
      captures: optional; JSON array of capture-row arrays
      captures_json: optional; alias for captures

  market_indicator_outcome_finalize:
    description: Evaluate 5/15/30-minute and close outcomes for persisted sector transmission episodes.
    params:
      trade_date: optional; defaults to the current UTC date
      limit: optional; maximum number of episodes to evaluate, defaults to 500

  market_indicator_benchmark:
    description: Measure real provider fetch plus indicator compute latency across 500/1500/3000/full-market universes.
    params:
      provider: optional; defaults to eltdx
      universe_sizes: optional; comma-separated sizes or a JSON list
      rounds: optional; defaults to 3, max 600
      batch_size: optional; defaults to 160
      pool_size: optional; defaults to 8
      timeout: optional; defaults to 8 seconds
      target_cadence_seconds: optional; defaults to 3; continuously repeat the bounded board pool while preserving at least this interval between completed passes
      persist: optional; persist benchmark run report, defaults to true

  market_indicator_intraday_session:
    description: Run one sequential intraday session under a single lease and adapt cadence from measured end-to-end latency.
    params:
      duration_seconds: optional; defaults to 300
      max_cycles: optional; safety cap for session cycles
      target_cadence_seconds: optional; defaults to 5
      universe_mode: optional; full_market by default
      pool_size: optional; defaults to 8
      batch_size: optional; defaults to 80 for a bounded low-latency quote payload

  market_indicator_limit_board_capture:
    description: Capture only current limit-up/down stocks at five-second cadence into a Redis trading-session buffer; no raw provider payload or PostgreSQL write.
    params:
      captured_at: optional; ISO timestamp for controlled replay or tests
      create_table: optional
      discovery_interval_seconds: ignored; whole-market discovery is published by market_indicator_refresh
      pool_size: optional; defaults to 8
      batch_size: optional; defaults to 80 for a bounded low-latency quote payload
      timeout: optional; defaults to 8 seconds
      quote_retry_attempts: optional; defaults to 0; a failed tracked code is isolated rather than delaying the full capture
      quote_retry_backoff_seconds: optional; defaults to 0.25
      quote_request_spacing_seconds: optional; defaults to 0.02
      quote_fallback_batch_size: optional; defaults to 80
      redis_prefix: optional; defaults to cynexus:market-indicator:limit-board:v1
      redis_ttl_seconds: optional; defaults to 43200

  market_indicator_limit_board_session:
    description: Own sequential limit-board captures for one short intraday session; the scheduler keeps one lease while the session runs.
    params:
      duration_seconds: optional; defaults to 300
      max_cycles: optional
      target_cadence_seconds: optional; defaults to 5
      discovery_interval_seconds: ignored; whole-market discovery is published by market_indicator_refresh
      pool_size: optional; defaults to 8
      batch_size: optional; defaults to 80 for a bounded low-latency quote payload
      timeout: optional; defaults to 8
      quote_retry_attempts: optional; defaults to 0; a failed tracked code is isolated rather than delaying the full capture
      quote_retry_backoff_seconds: optional; defaults to 0.25
      quote_request_spacing_seconds: optional; defaults to 0.02
      quote_fallback_batch_size: optional; defaults to 80
      redis_prefix: optional; defaults to cynexus:market-indicator:limit-board:v1
      redis_ttl_seconds: optional; defaults to 43200
      failure_backoff_seconds: optional; defaults to 2

  market_indicator_limit_board_finalize:
    description: Aggregate one completed limit-board trading session into PostgreSQL and delete its Redis buffer only after commit succeeds.
    params:
      finalized_at: optional; ISO timestamp for controlled replay or tests
      trade_date: optional; YYYY-MM-DD
      trade_session: optional; morning or afternoon
      create_table: optional
      sample_interval_seconds: optional; defaults to 5
      redis_prefix: optional; defaults to cynexus:market-indicator:limit-board:v1
      redis_ttl_seconds: optional; defaults to 43200
      source: optional
      session_stale_after_seconds: optional; defaults to 90; prevents finalization racing an active capture session

  build_trade_review_market_state:
    description: Materialize Trade Review minute and daily market-state read models from local TDX 1m, daily facts, industry memberships, and persisted Market Indicator events. Never calls an external quote API.
    params:
      trade_date: optional; defaults to today
      start_date: optional; inclusive historical backfill start; processed by raw-1m trading dates only
      end_date: optional; inclusive historical backfill end; defaults to start_date when only one bound is supplied
      window_days: optional; defaults to 60, range 5 to 240
      create_table: optional; apply the idempotent Trade Review projection schema
      redis_cache: optional; defaults to true
      redis_ttl_seconds: optional; defaults to 604800
      redis_prefix: optional; defaults to cynexus:trade-review:market-state

  rebuild_msi:
    description: Rebuild market sentiment index over a date range.
    params:
      start_date: optional
      end_date: optional
      force: optional
      require_full: optional
      create_table: optional

  backfill_history:
    description: Backfill historical market data.
    params:
      start_date: optional
      end_date: optional
      dataset: optional
      providers: optional

  repair_missing_data:
    description: Repair missing records for a dataset.
    params:
      dataset: optional
      trade_date: optional
      force: optional

  quality_check:
    description: Run data-quality checks.
    params:
      checks: optional
      dataset: optional
      trade_date: optional; required by screening_fact_coverage
      start_date: optional; inclusive coverage check start
      end_date: optional; inclusive coverage check end
      daily_table: optional; defaults to daily_raw
      checks: optional; add screening_fact_coverage to compare the durable projection with its ClickHouse source

  transcribe_media:
    description: Convert MP4 or audio input to transcript only.
    params:
      input_uri: required
      transcript_id: optional
      biz_id: optional
      language: optional
      force: optional
      create_table: optional
      work_dir: optional
      ffmpeg_path: optional
      transcriber: optional
      transcript_text: optional

  social_creator_discovery:
    description: Discover only public posts from authorized Xiaohongshu or Douyin creator profiles whose provider publish date is today in Asia/Shanghai.
    params:
      platform: required; douyin or xiaohongshu
      creators: optional; JSON array of {creator_key, profile_url, display_name}
      scope_key: optional; defaults to default
      lookback_hours: optional; retained for compatibility; strict calendar-day filtering is always applied
      create_table: optional
      profile_name: optional; defaults to default

  social_comment_sync:
    description: Incrementally collect currently visible public comments and replies only for posts published today in Asia/Shanghai.
    params:
      platform: required; douyin or xiaohongshu
      posts: optional; JSON array of {post_key, url, title}
      scope_key: optional; defaults to default
      active_post_days: optional; retained for compatibility; only today's posts are eligible
      max_posts: optional; bounded post count per run
      create_table: optional
      profile_name: optional; defaults to default

  social_xiaohongshu_collection:
    description: Discover all Xiaohongshu posts published today and collect every visible comment in the same run; reports comment-phase timing and seconds per 1000 comments.
    params:
      creators: optional; JSON array of {creator_key, profile_url, display_name}; omitted uses enabled database targets
      collection_purpose: optional; market_sentiment or market_analysis
      scope_key: optional; defaults to default
      max_posts: optional; only set to explicitly limit posts; omitted collects all discovered posts
      create_table: optional
      profile_name: optional; defaults to default

  social_douyin_collection:
    description: Discover all Douyin posts published today and collect every visible comment in the same run; reports comment-phase timing and seconds per 1000 comments.
    params:
      creators: optional; JSON array of {creator_key, profile_url, display_name}; omitted uses enabled database targets
      collection_purpose: optional; market_sentiment or market_analysis
      scope_key: optional; defaults to default
      max_posts: optional; only set to explicitly limit posts; omitted collects all discovered posts
      create_table: optional
      profile_name: optional; defaults to default
