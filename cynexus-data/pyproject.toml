[project]
name = "cynexus-data"
version = "0.1.0"
description = "Cynexus data ingestion jobs and market data utilities."
requires-python = ">=3.10"
dependencies = [
    "clickhouse-connect>=0.8.0",
    "duckdb>=1.0.0",
    "fastapi>=0.111.0",
    "imageio-ffmpeg>=0.6.0",
    "pandas>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.9",
    "pyarrow>=15.0.0",
    "pytdx>=1.72",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
    "SQLAlchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
live = [
    "akshare>=1.18.0",
    "accelerate>=0.25.0",
    "eltdx>=1.0.2",
    "mootdx>=0.11.0",
    "numpy>=2.0.0",
    "playwright>=1.50.0",
    "scipy>=1.14.0",
    "soundfile>=0.13.0",
    "torch>=2.7.0",
    "transformers>=4.52.0",
]

[project.scripts]
cynexus-ingest-tdx-1m = "cynexus_data.jobs.ingest_tdx_1m_to_clickhouse:main"
cynexus-ingest-parquet-1m = "cynexus_data.jobs.ingest_parquet_1m_to_clickhouse:main"
cynexus-health-check = "cynexus_data.jobs.health_check:main"
cynexus-trigger-api = "cynexus_data.interfaces.trigger_api.app:main"
cynexus-sync-kline-daily = "cynexus_data.jobs.sync_kline_daily:main"
cynexus-transcribe-media = "cynexus_data.jobs.transcribe_media:main"
cynexus-sync-stock-fund-flow = "cynexus_data.jobs.sync_stock_fund_flow:main"
cynexus-sync-ths-industry-constituents = "cynexus_data.jobs.sync_ths_industry_constituents:main"
cynexus-sync-stock-turnover = "cynexus_data.jobs.sync_stock_turnover:main"
cynexus-sync-tdx-intraday-detail = "cynexus_data.jobs.sync_tdx_intraday_detail:main"
cynexus-build-market-overview-detail = "cynexus_data.jobs.build_market_overview_detail:main"
cynexus-build-index-returns = "cynexus_data.jobs.build_index_returns:main"
cynexus-sync-tdx-industry-quotes = "cynexus_data.jobs.sync_tdx_industry_quotes:main"
cynexus-sync-tdx-industry-fund-flow = "cynexus_data.jobs.sync_tdx_industry_fund_flow:main"
cynexus-build-market-heatmap = "cynexus_data.jobs.build_market_heatmap:main"
cynexus-build-style-sector = "cynexus_data.jobs.build_style_sector:main"
cynexus-sync-tdx-sector-quote-details = "cynexus_data.jobs.sync_tdx_sector_quote_details:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cynexus_data*"]

[tool.setuptools.package-data]
cynexus_data = ["config/*.yaml"]
